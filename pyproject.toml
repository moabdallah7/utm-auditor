[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "utm-auditor"
version = "0.1.0"
description = "An open-source campaign URL quality checker for marketing teams that need reliable attribution data — deterministic, dependency-light, and runnable in CI with no API keys."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
]

[project.scripts]
utm-auditor = "utm_auditor.cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["utm_auditor"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B"]
ignore = ["N802", "N806"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
